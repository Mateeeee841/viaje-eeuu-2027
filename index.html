<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Noche de Nueva York: cielo azul con estrellas, una columna central de lectura y una barra inferior con 4 secciones.
   Un solo mundo visual (oscuro a propósito). Dorado = acción y elegido; coral = hay que decidir; el color propio de cada persona solo para lo personal. */
:root {
  --cielo-0: #060a24;
  --cielo-1: #0b1240;
  --cielo-2: #111a50;
  --cielo-3: #1a2566;
  --vidrio: rgba(255, 255, 255, .05);
  --vidrio-2: rgba(255, 255, 255, .09);
  --linea: rgba(255, 255, 255, .11);
  --tinta: #f5f3ff;
  --suave: #c3c8ee;
  --tenue: #9aa2d6;
  --oro: #f4c95d;
  --oro-2: #ffe7ad;
  --oro-tinta: #1d1642;
  --coral: #ff8f7e;
  --coral-fondo: rgba(255, 143, 126, .13);
  --ok: #82e6b9;
  --acento: #f4c95d;
  --c-NY: #ffa25e; --c-DC: #ff7482; --c-PHL: #4fd6c9; --c-JT: #8ddc7e; --c-FH: #c8a2ff; --c-BOS: #a3a9d4;
  --f-display: "Berkshire Swash", "Georgia", serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 20px;
  --r-sm: 12px;
  --sombra: 0 10px 30px rgba(2, 4, 20, .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--cielo-1);
  background-image:
    radial-gradient(1.2px 1.2px at 24px 38px, rgba(255, 248, 220, .75), transparent 60%),
    radial-gradient(1px 1px at 132px 92px, rgba(255, 255, 255, .55), transparent 60%),
    radial-gradient(1.4px 1.4px at 210px 18px, rgba(255, 236, 180, .7), transparent 60%),
    radial-gradient(1px 1px at 78px 160px, rgba(255, 255, 255, .45), transparent 60%),
    radial-gradient(1px 1px at 180px 210px, rgba(255, 255, 255, .5), transparent 60%),
    radial-gradient(900px 520px at 50% -160px, rgba(70, 96, 220, .45), transparent 70%),
    linear-gradient(180deg, #0e1650 0%, var(--cielo-1) 40%, var(--cielo-0) 100%);
  background-size: 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px, 100% 100%, 100% 100%;
  background-attachment: fixed;
  color: var(--tinta);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--cielo-0); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--oro-2); }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.suave { color: var(--suave); }
.tenue { color: var(--tenue); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

/* ---------- avatares y estampitas ---------- */
.av { display: inline-block; width: 28px; height: 28px; border-radius: 50%; background-size: cover; background-position: center; background-color: var(--cielo-3); flex: none; }
.avs { position: relative; display: inline-block; flex: none; line-height: 0; }
.avs .av { box-shadow: 0 0 0 2px var(--acento); }
.sticker { position: absolute; right: -4px; bottom: -4px; width: 46%; aspect-ratio: 1; border-radius: 50%; background: var(--cielo-0); box-shadow: 0 0 0 2px var(--acento); display: grid; place-items: center; }
.sticker svg { width: 66%; height: 66%; }

/* ---------- Inicio: ¿Quién sos? ---------- */
.intro { position: fixed; inset: 0; z-index: 50; overflow: auto; background: radial-gradient(120% 90% at 50% 10%, #1a2a7a 0%, #0b1240 55%, #050822 100%); color: #f4f2ff; }
.intro canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.intro-in { position: relative; min-height: 100%; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center;
  padding-block: max(40px, env(safe-area-inset-top, 0px)) 190px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.intro-kicker { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--oro); font-weight: 800; }
.intro h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(46px, 9vw, 84px); line-height: 1; color: #fff7dd; text-shadow: 0 0 24px rgba(244, 201, 93, .55), 0 2px 0 rgba(0, 0, 0, .25); }
.intro-sub { max-width: 34ch; color: #c9cff7; }
.personajes { display: grid; grid-template-columns: repeat(4, minmax(0, 150px)); gap: 24px; margin-top: 18px; }
.pj { --s: clamp(112px, 14vw, 150px); position: relative; display: grid; justify-items: center; gap: 12px; padding: 0; border: 0; background: none; color: #fff; }
.pj-marco { position: relative; width: var(--s); height: var(--s); }
.pj-av { display: block; width: 100%; height: 100%; border-radius: 50%; background-size: cover; background-position: center;
  box-shadow: 0 0 0 3px var(--oro), 0 0 0 7px rgba(142, 166, 255, .3), 0 12px 30px rgba(0, 0, 0, .45); transition: transform .25s ease, box-shadow .25s ease; }
.pj .sticker { width: 38%; right: -2px; bottom: 0; box-shadow: 0 0 0 3px var(--acento), 0 6px 14px rgba(0, 0, 0, .4); transition: transform .25s ease; }
.pj:hover .pj-av, .pj:focus-visible .pj-av { transform: translateY(-6px) scale(1.04); box-shadow: 0 0 0 3px #fff3c4, 0 0 0 8px rgba(244, 201, 93, .5), 0 0 40px rgba(244, 201, 93, .6); }
.pj:hover .sticker, .pj:focus-visible .sticker { transform: translateY(-6px) rotate(-8deg) scale(1.08); }
.pj:focus-visible { outline: none; }
.pj-n { font-family: var(--f-display); font-size: 28px; line-height: 1; color: #fff7dd; }
.pj-ultimo { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--oro-tinta); background: var(--oro); border-radius: 999px; padding: 2px 10px; }
.pj.es-ultimo .pj-av { box-shadow: 0 0 0 3px #fff3c4, 0 0 0 9px rgba(244, 201, 93, .45), 0 0 46px rgba(244, 201, 93, .5); }
.intro-pie { font-size: 14px; color: #a6aee6; margin-top: 6px; }
@media (max-width: 640px) { .personajes { grid-template-columns: repeat(2, minmax(0, 150px)); gap: 26px 30px; } .intro-in { padding-bottom: 150px; } }

/* ---------- Estructura ---------- */
.wrap { width: 100%; max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(6, 10, 36, .72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--linea); }
.barra-in { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.yo-btn { border: 0; background: none; padding: 4px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px; }
.yo-btn .av { width: 38px; height: 38px; }
.barra-t { font-weight: 800; font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-t small { display: block; font-size: 12px; font-weight: 700; color: var(--tenue); letter-spacing: .02em; }
.icono-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--linea); background: var(--vidrio); display: inline-grid; place-items: center; color: var(--suave); flex: none; }
.icono-btn:hover { color: var(--tinta); border-color: rgba(255, 255, 255, .25); }
.icono-btn svg { width: 20px; height: 20px; }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--tenue); flex: none; }
.sync-dot.vivo { background: var(--ok); box-shadow: 0 0 0 4px rgba(130, 230, 185, .18); }
main.wrap { padding-block: 20px calc(120px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
main.wrap > * { min-width: 0; }

/* Barra inferior: 4 secciones */
.nav { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  background: rgba(6, 10, 36, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--linea); }
.nav-in { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; margin: 0 auto; }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 9px 4px 10px; color: var(--tenue); font-size: 12px; font-weight: 800; position: relative; min-height: 62px; }
.nav button svg { width: 26px; height: 26px; }
.nav button[aria-current="page"] { color: var(--oro); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 34px; height: 3px; border-radius: 0 0 3px 3px; background: var(--oro); }
.nav .badge { position: absolute; top: 6px; left: calc(50% + 6px); background: var(--coral); color: var(--oro-tinta); border-radius: 999px; font-size: 11px; line-height: 18px; min-width: 18px; padding: 0 5px; }
@media (min-width: 900px) {
  .nav { left: 50%; right: auto; bottom: 18px; transform: translateX(-50%); width: 560px; border: 1px solid var(--linea); border-radius: 999px; padding: 0 10px; box-shadow: var(--sombra); }
}

/* ---------- Piezas ---------- */
.titulo { display: grid; gap: 6px; }
.titulo h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(32px, 6vw, 42px); line-height: 1.05; color: #fff7dd; }
.titulo p { color: var(--suave); max-width: 60ch; }
.sec { display: grid; gap: 14px; }
.sec > h2 { font-size: 22px; font-weight: 800; }
.sec > h2 small { font-size: 14px; color: var(--tenue); font-weight: 700; margin-left: 6px; }
.panel { background: var(--vidrio); border: 1px solid var(--linea); border-radius: var(--r); }
.pad { padding: 20px; }
.btn { border: 1px solid var(--linea); background: var(--vidrio-2); border-radius: 999px; padding: 11px 18px; font-weight: 800; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; color: var(--tinta); text-decoration: none; min-height: 44px; }
.btn:hover { border-color: rgba(255, 255, 255, .28); }
.btn svg { width: 18px; height: 18px; }
.btn.oro { background: var(--oro); color: var(--oro-tinta); border-color: var(--oro); box-shadow: 0 6px 20px rgba(244, 201, 93, .25); }
.btn.oro:hover { background: var(--oro-2); }
.btn.coral { background: var(--coral); color: var(--oro-tinta); border-color: var(--coral); }
.btn.chico { padding: 7px 13px; font-size: 14px; min-height: 36px; }
.btn.texto { border: 0; background: none; padding: 6px 2px; min-height: 0; color: var(--oro-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.fila-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ciudad { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14px; color: var(--suave); }
.ciudad::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--cc, var(--tenue)); flex: none; }
.c-NY { --cc: var(--c-NY); } .c-DC { --cc: var(--c-DC); } .c-PHL { --cc: var(--c-PHL); } .c-JT { --cc: var(--c-JT); } .c-FH { --cc: var(--c-FH); } .c-BOS { --cc: var(--c-BOS); }
.dur { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.dur svg { width: 15px; height: 15px; }
.dur.momento { color: var(--ok); font-weight: 800; }
.dur.jornada { color: var(--coral); font-weight: 800; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--suave); font-size: 14px; }
.estrella { width: 16px; height: 16px; fill: var(--oro); vertical-align: -2px; }
.prom { font-weight: 900; color: var(--oro-2); font-variant-numeric: tabular-nums; }
.votitos { display: inline-flex; gap: 6px; align-items: center; }
.votito { position: relative; line-height: 0; }
.votito .av { width: 22px; height: 22px; }
.votito em { position: absolute; right: -5px; bottom: -5px; font-style: normal; font-size: 10px; font-weight: 900; line-height: 14px; min-width: 14px; text-align: center; border-radius: 999px; background: var(--cielo-0); color: var(--oro-2); box-shadow: 0 0 0 1px var(--linea); }
.votito.sin .av { opacity: .3; filter: grayscale(1); }
.vacio { text-align: center; color: var(--suave); padding: 28px 16px; display: grid; gap: 10px; justify-items: center; }
.vacio svg { width: 240px; max-width: 78%; height: auto; }
.vacio h2 { font-family: var(--f-display); font-weight: 400; font-size: 32px; color: #fff7dd; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 4px; scroll-snap-type: x proximity; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; scroll-snap-align: start; border: 1px solid var(--linea); background: var(--vidrio); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 800; color: var(--suave); display: inline-flex; gap: 8px; align-items: center; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--tinta); color: var(--cielo-1); border-color: var(--tinta); }
.chip .cnt { font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
.chip.listo { color: var(--ok); }
.segmento { display: inline-flex; background: var(--vidrio); border: 1px solid var(--linea); border-radius: 999px; padding: 4px; gap: 2px; max-width: 100%; overflow-x: auto; }
.segmento button { border: 0; background: none; border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; color: var(--suave); white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.segmento button[aria-pressed="true"] { background: var(--tinta); color: var(--cielo-1); }
.segmento .av { width: 22px; height: 22px; }

/* ---------- Inicio ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 26px 22px 0; display: grid; align-content: start; gap: 6px;
  background: radial-gradient(120% 120% at 80% 0%, #2a3a9a 0%, #16206a 45%, #0b1240 100%); border: 1px solid rgba(255, 255, 255, .12); box-shadow: var(--sombra); }
.hero-txt { display: grid; gap: 6px; position: relative; z-index: 1; }
.hero-k { font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--oro); }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(42px, 9vw, 58px); line-height: 1; color: #fff7dd; text-shadow: 0 0 22px rgba(244, 201, 93, .4); }
.hero-lema { color: var(--acento); font-weight: 800; font-size: 15px; }
.hero-escena { width: min(330px, 94%); justify-self: end; margin: 6px -6px 0 0; position: relative; z-index: 1; }
.hero-escena svg, .hero-skyline svg { display: block; width: 100%; height: auto; }
.hero-skyline { margin: -40px -22px 0; color: #070b2c; position: relative; }
.hero-skyline::after { content: ""; position: absolute; left: calc(7.2% - 15px); top: calc(41% - 15px); width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 110, .95), rgba(255, 214, 110, 0) 70%); }
@media (min-width: 640px) { .hero { grid-template-columns: 1fr 300px; padding-top: 34px; } .hero-txt { align-self: center; } .hero-escena { margin: 0; } .hero-skyline { grid-column: 1 / -1; margin-top: -30px; } }
.cta { display: grid; gap: 14px; padding: 22px; }
.cta h2 { font-size: 22px; font-weight: 800; }
.progreso { height: 10px; border-radius: 999px; background: var(--vidrio-2); overflow: hidden; }
.progreso i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--acento), var(--oro)); }
.decidir { display: grid; gap: 12px; }
.dec { padding: 18px; display: grid; gap: 12px; background: var(--coral-fondo); border: 1px solid rgba(255, 143, 126, .35); border-radius: var(--r); }
.dec-k { font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: var(--coral); }
.dec h3 { font-size: 18px; font-weight: 800; line-height: 1.3; }
.dec p { color: var(--suave); font-size: 15px; }
.postales { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px) { .postales { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.postal { scroll-snap-align: start; text-align: left; border: 1px solid var(--linea); border-radius: 18px; overflow: hidden; display: grid; align-content: space-between; min-height: 150px; padding: 14px 14px 0; gap: 4px; color: var(--tinta);
  background: radial-gradient(100% 60% at 50% 100%, color-mix(in srgb, var(--cc) 40%, transparent), transparent 75%), linear-gradient(180deg, var(--cielo-3) 0%, var(--cielo-2) 100%); }
.postal b { font-size: 17px; font-weight: 900; display: block; }
.postal span { color: var(--suave); font-size: 14px; display: block; }
.postal .sil { color: rgba(5, 8, 32, .92); margin: 8px -14px 0; line-height: 0; }
.postal .sil svg { width: 100%; height: auto; display: block; }
.familia { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.miembro { display: grid; justify-items: center; gap: 8px; text-align: center; font-size: 15px; font-weight: 800; }
.anillo { --p: 0; width: 68px; height: 68px; border-radius: 50%; padding: 4px; background: conic-gradient(var(--acento) calc(var(--p) * 1%), rgba(255, 255, 255, .1) 0); display: grid; place-items: center; position: relative; }
.anillo .av { width: 60px; height: 60px; }
.anillo .sticker { width: 28px; right: -6px; bottom: -6px; }
.miembro small { color: var(--tenue); font-weight: 700; font-size: 13px; display: block; }
.linea-link { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; color: var(--tinta); border: 0; width: 100%; text-align: left; font-weight: 800; font-size: 16px; background: none; }
.linea-link span { color: var(--suave); font-weight: 700; }

/* ---------- Votar ---------- */
.tv { position: relative; overflow: hidden; border-radius: 26px; border: 1px solid rgba(255, 255, 255, .12); box-shadow: var(--sombra);
  background: radial-gradient(110% 45% at 50% 0%, color-mix(in srgb, var(--cc) 34%, transparent), transparent 75%), linear-gradient(180deg, var(--cielo-3) 0%, var(--cielo-2) 60%); display: grid; gap: 14px; padding: 20px; }
.tv-sil { position: absolute; left: 0; right: 0; top: 0; height: 96px; color: rgba(5, 8, 32, .55); opacity: 1; pointer-events: none; line-height: 0; }
.tv-sil svg { width: 100%; height: 100%; }
.tv-cab { position: relative; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.tv-cuenta { font-size: 13px; font-weight: 800; color: var(--suave); font-variant-numeric: tabular-nums; background: rgba(6, 10, 36, .5); border-radius: 999px; padding: 3px 10px; }
.tv h2 { position: relative; font-size: clamp(24px, 5.5vw, 30px); font-weight: 900; line-height: 1.15; margin-top: 40px; }
.tv-det { color: var(--suave); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tv-nota { color: var(--coral); font-weight: 700; font-size: 15px; }
.votar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.votar button { border: 1px solid var(--linea); background: var(--vidrio); border-radius: 16px; padding: 10px 2px 8px; display: grid; justify-items: center; gap: 2px; color: var(--suave); min-height: 66px; transition: transform .12s ease; }
.votar button b { font-size: 22px; font-weight: 900; color: var(--tinta); line-height: 1.1; }
.votar button span { font-size: 11px; font-weight: 800; line-height: 1.15; }
.votar button:hover { border-color: var(--acento); }
.votar button:active { transform: scale(.95); }
.votar button[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: var(--oro-tinta); box-shadow: 0 0 22px color-mix(in srgb, var(--acento) 45%, transparent); }

  background: radial-gradient(90% 70% at 50% 100%, color-mix(in srgb, var(--cc) 38%, transparent), transparent 70%), linear-gradient(180deg, var(--cielo-3) 0%, var(--cielo-2) 100%); display: grid; gap: 6px; }

.aviso-viaje { display: flex; gap: 10px; align-items: flex-start; color: var(--suave); font-size: 15px; padding: 0 4px; }

.item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 14px 6px; border: 0; background: none; text-align: left; width: 100%; color: var(--tinta); border-radius: 14px; }

.conector { display: flex; align-items: center; gap: 8px; margin-left: 26px; padding-left: 18px; border-left: 2px dotted rgba(255, 255, 255, .22); color: var(--tenue); font-size: 13px; font-weight: 700; min-height: 22px; }
.linea-suave { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 12px 6px; color: var(--tenue); font-size: 14px; border: 0; background: none; width: 100%; text-align: left; border-radius: 12px; }

/* ---------- Viaje ---------- */
.menu { display: grid; overflow: hidden; }

.recorrido { display: flex; flex-wrap: wrap; gap: 6px 6px; align-items: center; font-weight: 800; font-size: 14px; }

/* ---------- Hoja emergente ---------- */
.velo { position: fixed; inset: 0; z-index: 40; background: rgba(3, 5, 22, .66); display: grid; align-items: end; justify-items: center; }
@media (min-width: 720px) { .velo { align-items: center; } }
.hoja { width: min(600px, 100%); max-height: 90vh; overflow: auto; background: linear-gradient(180deg, var(--cielo-3), var(--cielo-2) 40%); border: 1px solid rgba(255, 255, 255, .12); border-radius: 26px 26px 0 0; box-shadow: var(--sombra);
  padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--tinta); color: var(--cielo-1); padding: 11px 18px; border-radius: 999px; font-weight: 800; font-size: 15px; box-shadow: var(--sombra); max-width: calc(100% - 32px); text-align: center; }

/* Festejo con los íconos de cada persona */

@keyframes chispa { from { transform: translate(0, 0) scale(.5); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.25) rotate(var(--rot)); opacity: 0; } }

/* ---------- Selectores (en vez de filas que se deslizan de costado) ---------- */

.of-n b { display: block; font-size: 16px; }
.of-n span { color: var(--tenue); font-size: 14px; }
.of-p { height: 8px; border-radius: 999px; background: var(--vidrio-2); overflow: hidden; }

.contador { padding: 18px 20px; display: grid; gap: 10px; }

/* Selector de día y calendario del mes */

/* Lista de todas las actividades */
.filtros-panel { padding: 18px; display: grid; gap: 14px; }
.filtros-panel .btn.texto { justify-self: start; font-size: 15px; }
.checks { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 700; color: var(--suave); }

.grupo-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 18px; font-weight: 900; padding: 22px 4px 6px; border-bottom: 1px solid rgba(255, 255, 255, .2); }

/* Momentos divididos y propuestas de separarse */

/* Planes divididos: dos opciones lado a lado y cada uno elige a cuál va */
.dos-op { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.op-div { display: grid; gap: 10px; grid-template-rows: auto 1fr auto auto; padding: 12px 10px 10px; border-radius: 16px; background: rgba(6, 10, 36, .45); border: 1px solid var(--linea); min-width: 0; }
.op-div.mia { border-color: var(--acento); box-shadow: inset 0 0 0 1px var(--acento); }
.op-k { font-size: 12px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
.op-itin { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; }
.op-itin li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; font-size: 14px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.op-itin time { color: var(--oro-2); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 2px; }
.op-van { display: flex; flex-wrap: wrap; gap: 5px; }
.quien { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 2px; border-radius: 999px; background: rgba(255, 255, 255, .09); border: 1px solid transparent; font-size: 13px; font-weight: 800; }
.quien.sug { border: 1px dashed rgba(255, 255, 255, .45); background: none; color: var(--suave); }
.quien.sug .av { opacity: .6; }
.op-div .btn { width: 100%; padding: 9px 10px; }
.div-estado { font-size: 14px; color: var(--suave); }
.linea-suave svg { width: 16px; height: 16px; vertical-align: -3px; color: var(--oro-2); }
.leyenda-div { display: grid; gap: 6px; margin: 4px 0 14px; }
.leyenda-div p { font-size: 14px; color: var(--suave); }
.leyenda-div b { color: var(--tinta); }
.quien-lista { display: grid; gap: 10px; margin-bottom: 8px; }
.quien-fila { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; align-items: center; padding: 12px; border-radius: 14px; background: var(--vidrio); border: 1px solid var(--linea); }
.qf-n b { display: block; }
.qf-n small { display: block; color: var(--tenue); font-size: 13px; }
.qf-seg { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: hidden; border-radius: 16px; }
.qf-seg button { justify-content: center; white-space: normal; text-align: center; border-radius: 12px; line-height: 1.2; }
.destello { animation: destello 1.8s ease-out 1; }
@keyframes destello { 0%, 100% { box-shadow: 0 0 0 0 rgba(244, 201, 93, 0); } 18% { box-shadow: 0 0 0 4px rgba(244, 201, 93, .7); } }

"A225":1,"A226":5,"A227":1,"A228":4,"A229":1,"A230":2,"A231":5,"A232":2,"A233":4,"A234":5,"A235":4,"A236":5,"A237":4,"A238":5,"A243":3}}}</script>
<script>
// Motor del calendario: arma los días según la ruta, asigna un barrio a cada día
// y llena cada franja por puntaje, duración y distancia. Sin DOM: lo usa la web
// y también las pruebas con Node.
(function (global) {
  "use strict";

  const FRANJAS = ["M", "T", "N"];
  const NOMBRE_FRANJA = { M: "Mañana", T: "Tarde", N: "Noche", C: "Comer" };
  const VENTANA = { M: [9, 13], T: [13.5, 18], N: [18.5, 23] };
  const ENTRE = 1 / 6; // 10 min entre una actividad y otra
  const COMER_H = 2;
  const NEUTRO = 12; // sin votos cuenta como "me da igual" (3 x 4)
  const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  const DIAS_LARGO = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
  const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  // --- utilidades ----------------------------------------------------------
  function sumarDias(iso, n) {
    const d = new Date(iso + "T12:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function diaSemana(iso) {
    return new Date(iso + "T12:00:00Z").getUTCDay();
  }
  function fechaCorta(iso) {
    return `${DIAS[diaSemana(iso)]} ${+iso.slice(8, 10)}`;
  }
  function fechaMedia(iso) {
    return `${DIAS[diaSemana(iso)]} ${+iso.slice(8, 10)} ${MESES[+iso.slice(5, 7) - 1]}`;
  }
  function hora(h) {
    const hh = Math.floor(h + 1e-6);
    const mm = Math.round((h - hh) * 60 / 5) * 5;
    return mm === 60 ? `${hh + 1}:00` : `${hh}:${String(mm).padStart(2, "0")}`;
  }
  function duracion(h) {
    if (h == null) return "?";
    const min = Math.round(h * 60);
    if (min < 60) return `${min} min`;
    const hh = Math.floor(min / 60), mm = min % 60;
    return mm ? `${hh} h ${mm}` : `${hh} h`;
  }
  function km(a, b) {
    const R = 6371, rad = Math.PI / 180;
    const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  // Minutos de viaje estimados: a pie hasta 1,3 km; si no, metro o auto.
  function viaje(a, b, modo) {
    if (!a || !b) return { min: 0, medio: "" };
    const d = km(a, b);
    if (d < 0.15) return { min: 0, medio: "" };
    if (d <= 1.3) return { min: Math.max(3, Math.round(d * 13)), medio: "a pie" };
    if (modo === "auto") return { min: Math.round(6 + d * 1.4), medio: "en auto" };
    return { min: Math.round(12 + d * 3.2), medio: "en metro" };
  }

  // Horario real investigado (a.h). ¿Se puede hacer entre s y e (horas decimales) ese día de la semana?
  // Devuelve {ok, ini, cierra, motivo, sinVerificar}. Sin datos: se permite, marcado como sin verificar.
  function ventanaHorario(a, dow, s, e) {
    const h = a.h;
    const d = a.ex ? 1 : a.d ?? 1;
    const tol = 0.25;
    if (!h || h.t === "desconocido") return { ok: true, ini: s, sinVerificar: true };
    if (h.t === "24h") {
      if (h.luz && s >= 18.5) return { ok: false, motivo: "luz" };
      return { ok: true, ini: s };
    }
    if (h.t === "funcion") {
      const horas = (h.f || []).filter(([dows]) => dows.includes(dow)).map(([, hr]) => hr).filter((hr) => hr >= s - 0.25 && hr + Math.min(d, 1.5) <= e + 0.75).sort((x, y) => x - y);
      return horas.length ? { ok: true, ini: Math.max(s, horas[0]) } : { ok: false, motivo: (h.f || []).some(([dows]) => dows.includes(dow)) ? "horario" : "cerrado" };
    }
    const dia = h.d && h.d[dow];
    if (!dia) return { ok: false, motivo: "cerrado" };
    const [ab, ci] = dia;
    const ultimo = h.u != null && h.u < ci ? h.u : ci;
    const ini = Math.max(s, ab);
    if (ini + d - tol > Math.min(e, ci) + 1e-6 || ini > ultimo + 1e-6) return { ok: false, motivo: "horario" };
    return { ok: true, ini, cierra: ci };
  }

  // Escala de duración que ve la gente al votar.
  function escala(a) {
    if (a.ex) return { k: "franja", txt: "Franja entera" };
    const h = a.d ?? 1;
    if (h <= 0.5) return { k: "momento", txt: "Un momento" };
    if (h <= 1.25) return { k: "rato", txt: "Un rato" };
    if (h <= 2.5) return { k: "media", txt: "Media franja" };
    if (h <= 4.5) return { k: "franja", txt: "Franja entera" };
    return { k: "jornada", txt: "Jornada" };
  }

  // --- votos ---------------------------------------------------------------
  function puntaje(personas, votos, id) {
    let s = 0, n = 0, max = 0, min = 6;
    const por = {};
    for (const p of personas) {
      const v = votos[p.k] && votos[p.k][id];
      if (v >= 1 && v <= 5) {
        s += v; n++; por[p.k] = v;
        if (v > max) max = v;
        if (v < min) min = v;
      }
    }
    const prom = n ? s / n : null;
    return {
      n, s, por, prom,
      sc: n ? prom * personas.length : null,
      ef: n ? prom * personas.length : NEUTRO,
      bajo: n >= 2 && prom < 3,
      dividido: n >= 2 && max >= 4 && min <= 2,
      completo: n === personas.length,
    };
  }

  // --- ruta ----------------------------------------------------------------
  function armarRuta(D, ruta) {
    const paradas = [];
    let f = D.inicio;
    ruta.paradas.forEach(([id, noches], i) => {
      paradas.push({ i, id, noches, desde: f, hasta: sumarDias(f, noches) });
      f = sumarDias(f, noches);
    });
    const tramos = [];
    for (let i = 0; i < paradas.length - 1; i++) {
      const a = paradas[i], b = paradas[i + 1];
      const clave = `${a.id}>${b.id}`;
      let t = D.tramos[clave];
      if (!t) {
        const dist = km(D.paradas[a.id].base, D.paradas[b.id].base);
        const auto = D.paradas[a.id].modo === "auto" || D.paradas[b.id].modo === "auto";
        t = { modo: auto ? "auto" : "tren", h: Math.round((dist / 85 + 0.5) * 4) / 4, sale: 9, txt: auto ? "Auto de alquiler" : "Tren", $: 0 };
      }
      const manual = !!(ruta.sale && ruta.sale[i] != null);
      tramos.push({ i, de: a.id, a: b.id, fecha: a.hasta, clave, ...t, sale: manual ? ruta.sale[i] : t.sale, saleBase: t.sale, manual });
    }
    // Costo: el primer tramo en auto de cada tanda paga el alquiler.
    tramos.forEach((t, k) => {
      if (t.modo === "auto") t.pp = k > 0 && tramos[k - 1].modo === "auto" && tramos[k - 1].fecha >= sumarDias(t.fecha, -1) ? 0 : D.autoPorPersona;
      else t.pp = t.$ || 0;
    });
    const noches = paradas.reduce((s, p) => s + p.noches, 0);
    const avisos = [];
    const total = (Date.parse(D.fin) - Date.parse(D.inicio)) / 864e5;
    if (noches !== total) avisos.push(`La ruta suma ${noches} noches y el viaje tiene ${total}.`);
    if (paradas.length && (paradas[0].id !== "NY" || paradas[paradas.length - 1].id !== "NY"))
      avisos.push("El vuelo llega y sale de JFK: la ruta tiene que empezar y terminar en Manhattan.");
    return { paradas, tramos, noches, avisos };
  }

  // Segmentos de cada día: en qué parada están y desde/hasta qué hora.
  function armarDias(D, R) {
    const dias = [];
    const ultimo = R.paradas.length ? R.paradas[R.paradas.length - 1].hasta : D.fin;
    for (let f = D.inicio; f <= ultimo; f = sumarDias(f, 1)) {
      const tocan = R.paradas.filter((p) => p.desde <= f && (f < p.hasta || (p.hasta === f && f !== D.fin) || (p.noches === 0 && p.desde === f)));
      const tramosDia = R.tramos.filter((t) => t.fecha === f).sort((a, b) => a.i - b.i);
      const segs = [];
      const notas = [];
      let t = 0;
      let actual = tocan.length ? tocan[0] : null;
      if (f === D.inicio) { t = 13; notas.push("Llegada a JFK a las 5:00. Taxi, dejar las valijas y desayunar; la mañana es para descansar."); }
      for (const tr of tramosDia) {
        const desde = R.paradas[tr.i];
        let sale;
        if (tr.manual) sale = tr.sale;
        else if (desde.noches === 0 || tr.sale == null) sale = t + (D.paradas[desde.id].estadia || 3);
        else sale = tr.sale;
        sale = Math.max(sale, t);
        tr.saleReal = sale;
        segs.push({ p: desde.id, pi: desde.i, de: t, a: sale });
        segs.push({ tramo: tr, de: sale, a: sale + tr.h });
        notas.push(`${tr.modo === "auto" ? "Auto" : tr.modo === "tren" ? "Tren" : "Viaje"} ${D.paradas[tr.de].nombre} → ${D.paradas[tr.a].nombre}: sale ${hora(sale)}, ${duracion(tr.h)}. ${tr.txt}.`);
        t = sale + tr.h;
        actual = R.paradas[tr.i + 1];
      }
      if (f === D.fin) {
        segs.length = 0;
        notas.push("Check-out ~10:00 y taxi a JFK. Vuelo a las 15:00.");
      } else if (actual) segs.push({ p: actual.id, pi: actual.i, de: t, a: 24 });

      const franjas = {};
      for (const fr of FRANJAS) {
        const [s, e] = VENTANA[fr];
        let mejor = null;
        for (const sg of segs) {
          if (!sg.p) continue;
          const ov = Math.min(e, sg.a) - Math.max(s, sg.de);
          if (ov > 0 && (!mejor || ov > mejor.ov)) mejor = { ov, sg };
        }
        if (mejor && mejor.ov >= 0.75) {
          franjas[fr] = { p: mejor.sg.p, pi: mejor.sg.pi, h: mejor.ov, desde: Math.max(s, mejor.sg.de), hasta: Math.min(e, mejor.sg.a) };
        } else {
          const tr = segs.find((sg) => sg.tramo && sg.de < e && sg.a > s);
          franjas[fr] = { viaje: tr ? tr.tramo : null };
        }
      }
      const horasPor = {};
      for (const fr of FRANJAS) if (franjas[fr].p) horasPor[franjas[fr].p] = (horasPor[franjas[fr].p] || 0) + franjas[fr].h;
      let comer = null;
      for (const [p, h] of Object.entries(horasPor)) if (!comer || h > comer.hTotal) comer = { p, hTotal: h };
      if (comer) comer.h = comer.hTotal >= 4 ? COMER_H : 1;
      const duermen = R.paradas.find((p) => p.noches > 0 && p.desde <= f && f < p.hasta);
      dias.push({ fecha: f, dow: diaSemana(f), franjas, comer, notas, segs, duermen: duermen ? duermen.id : null });
    }
    return dias;
  }

  // --- barrio de cada día ----------------------------------------------------
  function asignarTemas(D, dias, cambios, puntos) {
    const porCiudad = {};
    const bloques = {};
    for (const dia of dias) {
      const horas = {};
      for (const fr of FRANJAS) {
        const x = dia.franjas[fr];
        if (x.p) {
          horas[x.p] = horas[x.p] || { h: 0, frs: [], pi: x.pi };
          horas[x.p].h += x.h;
          horas[x.p].frs.push(fr);
        }
      }
      for (const [p, v] of Object.entries(horas)) {
        (porCiudad[p] = porCiudad[p] || []).push({ fecha: dia.fecha, dow: dia.dow, h: v.h, frs: v.frs, pi: v.pi, arribo: dia.fecha === D.inicio });
        bloques[`${p}#${v.pi}`] = bloques[`${p}#${v.pi}`] || [];
        bloques[`${p}#${v.pi}`].push(dia.fecha);
      }
    }
    const asig = {}; // fecha|ciudad -> tema
    const sinDia = [];
    for (const [ciudad, fechas] of Object.entries(porCiudad)) {
      const temas = D.temas.filter((t) => t.c === ciudad);
      const libre = new Map(fechas.map((x) => [x.fecha, x]));
      const usar = (t, x) => { asig[`${x.fecha}|${ciudad}`] = t.id; libre.delete(x.fecha); t._ok = true; };
      const lista = () => [...libre.values()];
      const primeros = new Set(), ultimos = new Set();
      for (const [k, fs] of Object.entries(bloques)) if (k.startsWith(ciudad + "#")) { primeros.add(fs[0]); ultimos.add(fs[fs.length - 1]); }
      temas.forEach((t) => { t._ok = false; });
      for (const t of temas) { const x = t.fecha && libre.get(t.fecha); if (x && x.h >= 1) usar(t, x); }
      for (const t of temas) { if (t._ok || t.tipo !== "arribo") continue; const x = lista().find((y) => y.arribo); if (x) usar(t, x); }
      for (const t of temas) { if (t._ok || t.dow == null) continue; const x = lista().find((y) => y.dow === t.dow && y.h >= 3); if (x) usar(t, x); }
      for (const t of temas) {
        if (t._ok) continue;
        let x = null;
        if (t.tipo === "llegada") x = lista().find((y) => primeros.has(y.fecha));
        else if (t.tipo === "salida") x = lista().reverse().find((y) => ultimos.has(y.fecha));
        else if (t.tipo === "noche") x = lista().find((y) => y.frs.length === 1 && y.frs[0] === "N");
        else if (t.tipo === "ultimo") x = lista().reverse().find((y) => y.h >= 8);
        if (x) usar(t, x);
      }
      for (const t of temas) {
        if (t._ok || t.tipo === "arribo") continue;
        const items = D.acts.filter((a) => a.th === t.id && !a.fr.includes("C"));
        let mejor = null, costo = Infinity;
        lista().forEach((x, k) => {
          let perdida = 0;
          for (const a of items) {
            if ((a.cl && a.cl.includes(x.dow)) || (a.dw && !a.dw.includes(x.dow))) perdida += (puntos[a.id] ? puntos[a.id].ef : NEUTRO) / 20;
          }
          const ajuste = t.tipo === "medio" ? (x.h >= 3 && x.h < 8.5 ? 0 : 1.5) : x.h >= 8.5 ? 0 : x.h >= 4 ? 2 : 4;
          const c = perdida * 2 + ajuste + k * 0.01;
          if (c < costo) { costo = c; mejor = x; }
        });
        if (mejor) usar(t, mejor);
      }
      for (const t of temas) if (!t._ok && t.tipo !== "arribo") sinDia.push(t.id);
    }
    // Cambios a mano: "el barrio X va el día Y" (intercambia si X ya tenía día).
    for (const [clave, tema] of Object.entries(cambios || {})) {
      if (!tema) continue;
      const [fecha, ciudad] = clave.split("|");
      if (!porCiudad[ciudad] || !porCiudad[ciudad].some((x) => x.fecha === fecha)) continue;
      const previo = asig[clave];
      if (tema === "comodin") { delete asig[clave]; if (previo) sinDia.push(previo); continue; }
      const otra = Object.keys(asig).find((k) => asig[k] === tema && k.endsWith("|" + ciudad));
      if (otra) { if (previo) asig[otra] = previo; else delete asig[otra]; }
      else { const i = sinDia.indexOf(tema); if (i >= 0) sinDia.splice(i, 1); if (previo) sinDia.push(previo); }
      asig[clave] = tema;
    }
    return { asig, sinDia, porCiudad };
  }

  // --- el plan ---------------------------------------------------------------
  function planificar(D, E) {
    const personas = D.personas;
    const votos = E.votos || {};
    const acts = D.acts.concat(E.extra || []).map((a) => {
      const d = E.duraciones && E.duraciones[a.id];
      return d ? { ...a, d, dCambio: a.d } : a;
    });
    const porId = Object.fromEntries(acts.map((a) => [a.id, a]));
    const pts = {};
    for (const a of acts) pts[a.id] = puntaje(personas, votos, a.id);

    const R = armarRuta(D, E.ruta);
    const dias = armarDias(D, R);
    const T = asignarTemas({ ...D, acts }, dias, E.temas, pts);
    const enRuta = new Set(R.paradas.map((p) => p.id));
    const ciudadDelDia = {};
    for (const dia of dias) {
      ciudadDelDia[dia.fecha] = new Set(FRANJAS.map((fr) => dia.franjas[fr].p).filter(Boolean));
    }

    const decisiones = { ...(E.decisiones || {}) };
    // Si en una propuesta de separarse los cuatro eligieron la otra opción, el plan del grupo pasa a ser esa.
    const decDiv = E.divisiones || {};
    for (const [clave, dv] of Object.entries(decDiv)) {
      if (dv && dv.act && !decisiones[clave] && eligen(dv, personas).every((e) => e === "alt")) decisiones[clave] = { pick: dv.act, drop: dv.contra };
    }
    const movidas = { ...(E.movidas || {}) };
    const pedidos = (E.pedidos || []).filter((p) => porId[p.act]);
    const forzados = new Set();
    for (const p of pedidos) {
      const van = sumanPedido(p, personas);
      if (van.length === personas.length) { movidas[p.act] = { fecha: p.fecha, f: p.f }; forzados.add(p.act); }
    }
    for (const [id, m] of Object.entries(movidas)) if (m) forzados.add(id);

    const info = {}; // id -> {plan, motivo, txt, compitio:[{fecha,f,motivo}]}
    for (const a of acts) info[a.id] = { plan: null, compitio: [] };
    const plan = {}; // fecha -> {M:{...}, T, N, C}

    // Prioridad: puntaje, un toque por estrella, por estar en su franja natural y
    // por tener fecha fija (solo se puede ese día). El viaje se descuenta aparte.
    const prioridad = (a, fr) => {
      const p = pts[a.id];
      return p.ef + (a.st ? 0.3 : 0) + (a.fr[0] === fr ? 0.5 : 0) + (a.fx ? 0.4 : 0) + (a.rec && !p.n ? 0.6 : 0) - (a.ord || 0) * 1e-4;
    };
    const abierto = (a, dow) => !((a.cl && a.cl.includes(dow)) || (a.dw && !a.dw.includes(dow)));

    function candidatos(dia, fr, ciudad, tema, comodin) {
      const lista = [];
      for (const a of acts) {
        if (a.c !== ciudad) continue;
        const m = movidas[a.id];
        let entra;
        if (m) entra = m.fecha === dia.fecha && m.f === fr;
        else if (a.fx) entra = a.fx === dia.fecha && a.fr.includes(fr);
        else if (comodin) entra = !info[a.id].plan && !pts[a.id].bajo && a.fr.includes(fr) && !info[a.id].fijoOtro;
        else entra = tema && a.th === tema && a.fr.includes(fr);
        if (!entra || info[a.id].plan || a.nd) continue;
        if (!abierto(a, dia.dow)) {
          if (!comodin) info[a.id].compitio.push({ fecha: dia.fecha, f: fr, motivo: "cerrado" });
          continue;
        }
        // Horario real: que esté abierto (o tenga función) en esta franja.
        if (fr !== "C") {
          const x = dia.franjas[fr];
          const sig = FRANJAS[FRANJAS.indexOf(fr) + 1];
          const extra = sig && dia.franjas[sig].p === x.p ? dia.franjas[sig].h : 0;
          const vh = ventanaHorario(a, dia.dow, x.desde, x.hasta + extra);
          if (!vh.ok) {
            if (!comodin) info[a.id].compitio.push({ fecha: dia.fecha, f: fr, motivo: vh.motivo === "cerrado" ? "cerrado" : "horario" });
            continue;
          }
        }
        lista.push(a);
      }
      return lista;
    }

    // Llena una franja: elige por prioridad lo que entra en el tiempo, sumando el viaje.
    function llenar(lista, fr, horas, desde, inicio, modo, siguiente, obligado, excluir, base, dow) {
      const usados = [];
      const alt = new Set();
      let resto = horas, pos = inicio, extra = 0;
      const pool = lista.filter((a) => !excluir.has(a.id));
      for (;;) {
        let mejor = null;
        for (const a of pool) {
          if (usados.some((u) => u.a === a)) continue;
          if (a.alt && alt.has(a.alt)) continue;
          if (pts[a.id].bajo && !obligado.has(a.id)) continue;
          if (a.ex && (usados.length || resto < 1)) continue;
          // Descansar es volver al alojamiento.
          const v = viaje(pos, a.ex ? base : a.ll, modo);
          // Fuera de su franja natural, lo corto solo si queda de paso (lo largo justifica el viaje).
          if (fr !== "C" && a.fr[0] !== fr && v.min > Math.max(20, (a.d ?? 1) * 30) && !obligado.has(a.id) && !movidas[a.id]) continue;
          // Horario real. Si abre más tarde, la espera ocupa tiempo; si es una función o un partido,
          // alcanza con que empiece dentro de la franja (mientras tanto se hace otra cosa).
          let espera = 0;
          if (fr !== "C" && !a.ex) {
            const fin = desde + horas + (usados.length ? 0 : siguiente);
            const anclada = a.hr != null || (a.h && a.h.t === "funcion");
            if (anclada) { if (!ventanaHorario(a, dow, desde, fin).ok) continue; }
            else {
              const llega = desde + (horas - resto) + v.min / 60 + (usados.length ? ENTRE : 0);
              const vh = ventanaHorario(a, dow, llega, fin);
              if (!vh.ok) continue;
              espera = Math.max(0, vh.ini - llega);
            }
          }
          const nec = a.ex ? resto : (a.d ?? 1) + v.min / 60 + (usados.length ? ENTRE : 0) + espera;
          let entra = nec <= resto + 1e-6;
          let span = 0;
          if (!entra && !usados.length && siguiente > 0 && nec <= resto + siguiente + 1e-6) { entra = true; span = nec - resto; }
          if (!entra) continue;
          const p = prioridad(a, fr) - v.min / 40 + (obligado.has(a.id) ? 100 : 0);
          if (!mejor || p > mejor.p) mejor = { a, v, nec, span, p };
        }
        if (!mejor) break;
        usados.push({ a: mejor.a, viaje: mejor.v, nec: mejor.nec });
        if (mejor.a.alt) alt.add(mejor.a.alt);
        resto -= mejor.nec - mejor.span;
        if (mejor.span) { extra = mejor.span; resto = 0; }
        if (mejor.a.ex) resto = 0;
        if (mejor.a.end || mejor.a.ll) pos = mejor.a.end || mejor.a.ll;
      }
      // Orden del día: primero lo que se puede empezar antes (y lo que cierra antes);
      // lo que tiene hora fija o abre más tarde, después. El viaje se recalcula en ese orden.
      if (fr === "C") return { usados: usados.map((u) => ({ ...u, desde: 0, hasta: 0 })), resto: Math.max(0, resto), pos, extra };
      // Lo que tiene hora de inicio (partido, función, salida del tren) queda anclado a esa hora;
      // lo demás se acomoda antes, si llega a tiempo, o después.
      const datos = usados.map((u, i) => {
        if (u.a.hr != null) return { u, i, i0: u.a.hr, ci: 99, ancla: true };
        const vh = ventanaHorario(u.a, dow, desde, desde + 24);
        return { u, i, i0: vh.ok ? vh.ini : desde, ci: vh.cierra || 99, ancla: !!(u.a.h && u.a.h.t === "funcion") };
      }).sort((x, y) => x.i0 - y.i0 || x.ci - y.ci || x.i - y.i);
      const anclas = datos.filter((d) => d.ancla), libres = datos.filter((d) => !d.ancla);
      const proxima = (a, desdeH) => {
        if (a.hr != null) return a.hr;
        const hs = ((a.h && a.h.f) || []).filter(([dows]) => dows.includes(dow)).map(([, hr]) => hr).filter((hr) => hr >= desdeH - 0.05).sort((x, y) => x - y);
        return hs.length ? hs[0] : desdeH;
      };
      const durDe = (a) => (a.ex ? Math.max(1, horas) : a.d ?? 1);
      let t = desde, p2 = inicio, k = 0;
      const orden = [];
      const poner = (d) => {
        const a = d.u.a;
        const v = viaje(p2, a.ex ? base : a.ll, modo);
        const llega = t + v.min / 60 + (orden.length ? ENTRE : 0);
        // Un partido o evento empieza a su hora (si hace falta, se sale antes de lo anterior).
        const ini = a.hr != null ? a.hr : d.ancla ? Math.max(llega, proxima(a, Math.max(llega, d.i0))) : Math.max(llega, d.i0);
        orden.push({ ...d.u, viaje: v, desde: ini, hasta: ini + durDe(a) });
        t = ini + durDe(a);
        if (a.end || a.ll) p2 = a.end || a.ll;
      };
      for (const d of libres) {
        // ¿Entra antes de la próxima cosa anclada, contando el viaje hasta ahí?
        while (k < anclas.length) {
          const a = d.u.a, sig = anclas[k];
          const ini = Math.max(t + viaje(p2, a.ex ? base : a.ll, modo).min / 60 + (orden.length ? ENTRE : 0), d.i0);
          const llegaAncla = ini + durDe(a) + viaje(a.end || a.ll || p2, sig.u.a.ll, modo).min / 60 + ENTRE;
          if (llegaAncla <= proxima(sig.u.a, sig.i0) + 1e-6) break;
          poner(anclas[k++]);
        }
        poner(d);
      }
      while (k < anclas.length) poner(anclas[k++]);
      return { usados: orden, resto: Math.max(0, resto), pos: p2 || pos, extra };
    }

    // Pase 1: días con barrio. Pase 2: días comodín y franjas que su barrio dejó vacías,
    // que se llenan con lo mejor que sobró en la ciudad.
    const relleno = new Set();
    function planDia(dia, comodines) {
      const p = (plan[dia.fecha] = plan[dia.fecha] || {});
      let pos = null, ciudadPos = null, arrastre = 0;
      for (let i = 0; i < FRANJAS.length; i++) {
        const fr = FRANJAS[i];
        const x = dia.franjas[fr];
        if (!x.p) { p[fr] = p[fr] || { viaje: x.viaje }; arrastre = 0; continue; }
        const tema = T.asig[`${dia.fecha}|${x.p}`] || null;
        const clave = `${dia.fecha}|${fr}`;
        const esComodin = !tema || relleno.has(clave);
        if (esComodin !== comodines || (p[fr] && p[fr].usados)) { if (p[fr] && p[fr].usados) { pos = p[fr].pos; ciudadPos = x.p; } continue; }
        const lista = candidatos(dia, fr, x.p, tema, esComodin);
        if (!comodines && !lista.length) { relleno.add(clave); continue; }
        const dec = decisiones[clave];
        const obligado = new Set([...forzados].filter((id) => lista.some((a) => a.id === id)));
        const excluir = new Set();
        if (dec && dec.pick && lista.some((a) => a.id === dec.pick)) { obligado.add(dec.pick); if (dec.drop) excluir.add(dec.drop); }
        const sig = FRANJAS[i + 1];
        const siguiente = sig && dia.franjas[sig].p === x.p ? dia.franjas[sig].h : 0;
        const modo = D.paradas[x.p].modo;
        const inicio = ciudadPos === x.p && pos ? pos : D.paradas[x.p].base;
        const horas = x.h - arrastre;
        const r = llenar(lista, fr, horas, x.desde + arrastre, inicio, modo, siguiente, obligado, excluir, D.paradas[x.p].base, dia.dow);
        arrastre = r.extra;
        for (const u of r.usados) info[u.a.id].plan = { fecha: dia.fecha, f: fr, desde: u.desde, hasta: u.hasta };
        p[fr] = { p: x.p, tema, comodin: esComodin, relleno: !!tema && esComodin, h: x.h, desdeH: x.desde, hastaH: x.hasta, usados: r.usados, resto: r.resto, pos: r.pos, lista, obligado, excluir, modo, inicio };
        pos = r.pos; ciudadPos = x.p;
      }
      // Comer
      const claveC = `${dia.fecha}|C`;
      const temaC = dia.comer ? T.asig[`${dia.fecha}|${dia.comer.p}`] || null : null;
      const comodinC = !temaC || relleno.has(claveC);
      if (dia.comer && comodinC === comodines && !(p.C && p.C.usados)) {
        const tema = temaC;
        const lista = candidatos(dia, "C", dia.comer.p, tema, comodinC);
        if (!comodines && !lista.length) { relleno.add(claveC); return; }
        const dec = decisiones[`${dia.fecha}|C`];
        const obligado = new Set([...forzados].filter((id) => lista.some((a) => a.id === id)));
        const excluir = new Set();
        if (dec && dec.pick && lista.some((a) => a.id === dec.pick)) { obligado.add(dec.pick); if (dec.drop) excluir.add(dec.drop); }
        const r = llenar(lista, "C", dia.comer.h, 0, null, D.paradas[dia.comer.p].modo, 0, obligado, excluir, null, dia.dow);
        for (const u of r.usados) info[u.a.id].plan = { fecha: dia.fecha, f: "C" };
        p.C = { p: dia.comer.p, tema, comodin: comodinC, relleno: !!tema && comodinC, h: dia.comer.h, usados: r.usados, resto: r.resto, lista, obligado, excluir };
      } else if (!dia.comer) p.C = p.C || null;
    }

    for (const a of acts) if (a.fx && enRuta.has(a.c) && !(ciudadDelDia[a.fx] && ciudadDelDia[a.fx].has(a.c))) info[a.id].fijoOtro = true;
    for (const dia of dias) planDia(dia, false);
    for (const dia of dias) planDia(dia, true);

    // Afuera de cada franja, empates, planes aparte y huecos.
    const empates = [], huecos = [];
    for (const dia of dias) {
      const p = plan[dia.fecha];
      for (const fr of [...FRANJAS, "C"]) {
        const x = p[fr];
        if (!x || !x.usados) continue;
        const dentro = new Set(x.usados.map((u) => u.a.id));
        x.afuera = [];
        if (x.comodin) {
          // Día comodín: compite todo lo que sobró de la ciudad; mostramos solo lo mejor que no entró.
          x.afuera = x.lista.filter((a) => !info[a.id].plan).sort((m, n) => prioridad(n, fr) - prioridad(m, fr)).slice(0, 5).map((a) => ({ a, motivo: "tiempo" }));
          x.empates = [];
          continue;
        }
        for (const a of x.lista) {
          if (dentro.has(a.id) || info[a.id].plan) continue;
          let motivo = "tiempo";
          if (x.excluir.has(a.id)) motivo = "decision";
          else if (pts[a.id].bajo) motivo = "bajo";
          else if (a.alt && x.usados.some((u) => u.a.alt === a.alt)) motivo = "alternativa";
          info[a.id].compitio.push({ fecha: dia.fecha, f: fr, motivo });
          x.afuera.push({ a, motivo });
        }
        // Empate: alguien afuera con el mismo puntaje que algo que entró.
        x.empates = [];
        for (const af of x.afuera) {
          if (af.motivo !== "tiempo") continue;
          const pa = pts[af.a.id];
          if (!pa.n || pa.sc < NEUTRO) continue;
          const rival = x.usados.find((u) => !x.obligado.has(u.a.id) && pts[u.a.id].n && Math.abs(pts[u.a.id].sc - pa.sc) < 0.01);
          if (rival) {
            const e = { fecha: dia.fecha, f: fr, p: x.p, sc: pa.sc, entra: rival.a, fuera: af.a };
            x.empates.push(e); empates.push(e);
            af.motivo = "empate";
            const c = info[af.a.id].compitio; c[c.length - 1].motivo = "empate";
          }
        }
      }
    }

    // Planes divididos: si a una parte de la familia le conviene claramente otra cosa en esta franja
    // (le puso 4 o 5 y al menos 2 puntos más que a lo principal del plan) y el resto prefiere el plan,
    // se proponen dos opciones y cada uno elige a cuál va. Los grupos salen de esas elecciones.
    const divisiones = [];
    // Lo que hace solo una parte de la familia también está en el plan, con quiénes van.
    const marcarSub = (usados, fecha, f, van) => {
      for (const u of usados) if (!info[u.a.id].plan) info[u.a.id].plan = { fecha, f, desde: u.desde, hasta: u.hasta, van };
    };
    const voto = (k, a) => (a && votos[k] && votos[k][a.id]) || 0;
    const sugiere = (k, j, i) => (voto(k, j) >= 4 && (voto(k, j) || 3) - (voto(k, i) || 3) >= 2 ? "alt" : "plan");
    // Se compara cada cosa que quedó afuera (j) contra cada cosa del plan que podría reemplazar (i):
    // lo que no es un momento corto, porque un momento se puede hacer igual.
    function mejorDivision(x, dia, fr) {
      const reemplazables = x.usados.filter((u) => !u.a.ex && (u.a.d ?? 1) >= 0.75).map((u) => u.a);
      if (!reemplazables.length) return null;
      let mejor = null;
      for (const o of x.afuera) {
        if (!["tiempo", "empate"].includes(o.motivo)) continue;
        const j = o.a;
        if (!ventanaHorario(j, dia.dow, x.desdeH, x.hastaH).ok) continue;
        for (const i of reemplazables) {
          const vj = (k) => voto(k, j) || 3, vi = (k) => voto(k, i) || 3;
          const grupo = personas.filter((p) => voto(p.k, j) >= 4 && vj(p.k) - vi(p.k) >= 2).map((p) => p.k);
          if (!grupo.length || grupo.length === personas.length) continue;
          if (personas.some((p) => !grupo.includes(p.k) && vj(p.k) > vi(p.k))) continue;
          const beneficio = grupo.reduce((s, k) => s + vj(k) - vi(k), 0);
          if (beneficio < 3) continue;
          if (!mejor || beneficio > mejor.beneficio) mejor = { act: j, contra: i, grupo, beneficio };
        }
      }
      return mejor;
    }
    for (const dia of dias) {
      const p = plan[dia.fecha];
      for (const fr of FRANJAS) {
        const x = p[fr];
        if (!x || !x.usados || x.comodin) continue;
        const clave = `${dia.fecha}|${fr}`;
        const dec = decDiv[clave];
        let prop = null;
        if (dec && dec.act) { if (porId[dec.act] && porId[dec.act].c === x.p) prop = { act: porId[dec.act], contra: porId[dec.contra] || null, beneficio: 0 }; }
        else if (!dec) prop = mejorDivision(x, dia, fr);
        if (!prop) continue;
        const j = prop.act;
        const elige = Object.fromEntries(personas.map((q, n) => [q.k, eligen(dec, personas)[n]]));
        const todosAlt = personas.every((q) => elige[q.k] === "alt");
        // Si lo otro ya entró al plan por su cuenta, no hay nada que elegir.

    else if (e && e.code === "quota_exceeded") aviso("La base del viaje está llena. Avisale a Mateo.");
    else aviso("No se pudo guardar. Probá de nuevo en un rato.");
  }
  function parche(doc, cambio) {
    S.docs[doc] = mezclar(S.docs[doc] || {}, clon(cambio));
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (!S.puedeEscribir) return;
    pendientes[doc] = mezclar(pendientes[doc] || {}, clon(cambio));
    clearTimeout(timers[doc]);
    timers[doc] = setTimeout(() => enviar(doc), 400);
  }
  async function enviar(doc) {
    const cambio = pendientes[doc];
    if (!cambio) return;
    delete pendientes[doc];
    const ref = db.doc("estado/" + doc);
    try { await ref.update(cambio); }
    catch (e) {
      if (e && e.code === "invalid_argument") {
        try { await ref.set(clon(S.docs[doc])); } catch (e2) { errorEscritura(e2); }
      } else if (e && e.code === "unavailable") { setTimeout(() => { pendientes[doc] = mezclar(pendientes[doc] || {}, cambio); enviar(doc); }, 1500 + Math.random() * 1000); }
      else errorEscritura(e);
    }
  }
  function reemplazar(doc, valor) {
    S.docs[doc] = clon(valor);
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (!S.puedeEscribir) return;
    db.doc("estado/" + doc).set(clon(valor)).catch(errorEscritura);
  }
  let timerVotos = null;
  function votar(id, v) {
    const mios = S.votos[S.yo];
    if (mios[id] === v) delete mios[id]; else mios[id] = v;
    recalcular();
    if (S.modo === "local") return guardarTodoLocal();
    if (!S.puedeEscribir) return;
    clearTimeout(timerVotos);
    const yo = S.yo;
    timerVotos = setTimeout(() => { timerVotos = null; db.doc("votos/" + yo).set({ v: clon(S.votos[yo]), t: Date.now() }).catch(errorEscritura); }, 500);
  }
  function guardarPedido(p) {
    const i = S.pedidos.findIndex((x) => x.id === p.id);
    if (i >= 0) S.pedidos[i] = p; else S.pedidos.push(p);
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (!S.puedeEscribir) return;
    const { id, ...cuerpo } = p;
    db.doc("pedidos/" + id).set(cuerpo).catch(errorEscritura);
  }
  function responderPedido(id, r) {
    const p = S.pedidos.find((x) => x.id === id);
    if (!p) return;
    p.resp = { ...(p.resp || {}), [S.yo]: r };
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (!S.puedeEscribir) return;
    db.doc("pedidos/" + id).update({ resp: { [S.yo]: r } }).catch(errorEscritura);
  }
  function borrarPedido(id) {
    S.pedidos = S.pedidos.filter((x) => x.id !== id);
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (S.puedeEscribir) db.doc("pedidos/" + id).delete().catch(errorEscritura);
  }
  function guardarExtra(a) {
    S.extra.push(a);
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (!S.puedeEscribir) return;
    const { id, ...cuerpo } = a;
    db.doc("extra/" + id).set(cuerpo).catch(errorEscritura);
  }
  function borrarExtra(id) {
    S.extra = S.extra.filter((x) => x.id !== id);
    recalcular(); render();
    if (S.modo === "local") return guardarTodoLocal();
    if (S.puedeEscribir) db.doc("extra/" + id).delete().catch(errorEscritura);
  }

  async function conectar() {
    const local = leerLocal(CLAVE_LOCAL);
    const cargarLocal = () => {
      if (local) { if (local.votos) S.votos = { ...S.votos, ...local.votos }; S.docs = { ...S.docs, ...local.docs }; S.pedidos = local.pedidos || []; S.extra = local.extra || []; }
      S.modo = "local"; recalcular(); render();
    };
    if (!window.claude || !window.claude.use) return cargarLocal();
    S.modo = "conectando"; render();
    const [base, user, descargas] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("downloads")]);
    S.descargas = descargas;
    if (!base) return cargarLocal();
    db = base;
    S.modo = "vivo";
    if (user) { const puede = await user.can("data.write"); if (puede === false) { S.puedeEscribir = false; S.modo = "lectura"; } }
    const fallo = (e) => { if (e && e.code === "revoked") { S.modo = "lectura"; S.puedeEscribir = false; render(); } };
    db.collection("votos").onSnapshot((snap) => {
      for (const d of snap.docs) {
        if (!NOMBRE[d.id]) continue;
        if (d.id === S.yo && timerVotos) continue; // mis votos sin guardar todavía mandan
        S.votos[d.id] = { ...((d.data() || {}).v || {}) };
      }
      programar();
    }, fallo);
    db.collection("estado").onSnapshot((snap) => {
      for (const d of snap.docs) S.docs[d.id] = mezclar(clon(d.data() || {}), clon(pendientes[d.id] || {}));
      programar();
    }, fallo);
    db.collection("pedidos").onSnapshot((snap) => { S.pedidos = snap.docs.map((d) => ({ id: d.id, ...d.data() })); programar(); }, fallo);
    db.collection("extra").onSnapshot((snap) => { S.extra = snap.docs.map((d) => ({ id: d.id, ...d.data() })); programar(); }, fallo);
    recalcular(); render();
  }
  let rafRender = 0;
  function programar() { cancelAnimationFrame(rafRender); rafRender = requestAnimationFrame(() => { recalcular(); render(); }); }

  // ---------- piezas reutilizables ----------
  const stickerSvg = (k, px) => Deco.svgIcono(STICKER[k], k === "mateo" ? "#facc15" : Deco.ACENTO[k], px, 1);
  function avSticker(k, px) {
    return `<span class="avs" style="--acento:${Deco.ACENTO[k]}"><span class="av av-${esc(k)}" style="width:${px}px;height:${px}px" role="img" aria-label="${esc(NOMBRE[k])}"></span><span class="sticker">${stickerSvg(k, 24)}</span></span>`;
  }
  const av = (k, px) => `<span class="av av-${esc(k)}" style="width:${px}px;height:${px}px" role="img" aria-label="${esc(NOMBRE[k] || k)}"></span>`;
  const ciudad = (c) => `<span class="ciudad c-${esc(c)}">${esc(D.paradas[c] ? D.paradas[c].nombre : c)}</span>`;
  const lugar = (a) => (a.z ? `<span class="ciudad c-${esc(a.c)}">${esc(a.z)}</span>` : ciudad(a.c));
  const temaDe = (id) => D.temas.find((t) => t.id === id);
  const precio = (a) => (a.$ ? `US$${a.$} c/u` : a.$ === 0 ? "Gratis" : "Precio a confirmar");
  function franjaTxt(a) {
    if (a.fr.includes("C")) return "Para comer";
    return a.fr.filter((f) => f !== "C").slice(0, 2).map((f) => FR[f]).join(" o ");
  }
  function durChip(a) {
    if (a.ex) return `<span class="dur">${I.reloj}Ocupa toda la ${FR[a.fr[0]].toLowerCase()}</span>`;
    const h = a.d ?? 1;
    if (h <= 0.5) return `<span class="dur momento">${I.rayo}Un momento · ${Plan.duracion(h)}</span>`;
    if (h > 4.5) return `<span class="dur jornada">${I.sol}Jornada · ${Plan.duracion(h)}</span>`;
    return `<span class="dur">${I.reloj}${Plan.duracion(h)}</span>`;
  }
  const promTxt = (pt) => (pt.n ? num1(pt.prom) : "–");
  function votitos(a) {
    const pt = P.pts[a.id];
    if (!pt.n) return "";
    return `<span class="votitos" aria-label="Votos de la familia">${PERS.map((p) => { const v = pt.por[p.k]; return `<span class="votito ${v ? "" : "sin"}" title="${esc(p.n)}: ${v ? VOTO_LARGO[v] : "sin votar"}">${av(p.k, 22)}${v ? `<em>${v}</em>` : ""}</span>`; }).join("")}</span>`;
  }
  function estadoAct(a) {
    const inf = P.info[a.id];
    if (a.nd) return `<span class="estado coral">No disponible</span> <span class="tenue" style="font-size:14px">${esc(a.nd)}</span>`;
    if (!P.enRuta.has(a.c)) return `<span class="estado">Fuera de la ruta</span>`;
    if (inf.plan) return `<span class="estado oro">En el plan · ${Plan.fechaCorta(inf.plan.fecha)}, ${FR[inf.plan.f].toLowerCase()}${inf.plan.desde ? " " + Plan.hora(inf.plan.desde) : ""}</span>${inf.plan.van ? ` <span class="tenue" style="font-size:14px">Van ${esc(juntar(inf.plan.van))}</span>` : ""}`;
    return `<span class="estado ${inf.motivo === "empate" ? "coral" : ""}">No entró</span> <span class="tenue" style="font-size:14px">${esc(inf.txt || "")}</span>`;
  }
  function actsEnRuta() { return P.acts.filter((a) => P.enRuta.has(a.c) && !a.nd); }
  const enlaceMapa = (a) => (a.ll ? `https://www.google.com/maps/search/?api=1&query=${a.ll[0]},${a.ll[1]}` : null);
  // Localidades: en Nueva York, el barrio real (Manhattan, Brooklyn, Queens, Bronx); afuera, la ciudad.
  function locDe(a) {
    if (a.c !== "NY") return D.paradas[a.c] ? D.paradas[a.c].nombre : a.c;
    const z = a.z || "Manhattan";
    return z === "Manhattan y Brooklyn" ? "Manhattan" : z === "Fuera de la ciudad" ? "Afueras de Nueva York" : z;
  }
  function localidades() {
    const out = [];
    for (const c of [...new Set(P.R.paradas.map((p) => p.id))]) {
      if (c === "NY") ["Manhattan", "Brooklyn", "Queens", "Bronx", "Afueras de Nueva York"].forEach((k) => out.push({ k, c, zona: true }));
      else out.push({ k: D.paradas[c].nombre, c, zona: false });
    }
    const ruta = actsEnRuta();
    return out.filter((l) => ruta.some((a) => locDe(a) === l.k));
  }
  const enLoc = (a, loc) => !loc || loc === "todas" || locDe(a) === loc;
  function decks(loc) {
    const ciudades = [...new Set(P.R.paradas.map((p) => p.id))];
    const out = [];
    for (const c of ciudades) for (const t of D.temas.filter((x) => x.c === c)) {
      const items = P.acts.filter((a) => a.th === t.id && P.enRuta.has(a.c) && !a.nd && enLoc(a, loc)).sort((x, y) => (x.ord || 0) - (y.ord || 0));
      if (items.length) out.push({ id: t.id, c, corto: t.corto, n: t.n, items, hechos: items.filter((a) => S.votos[S.yo][a.id]).length });
    }
    return out;
  }
  function itemsLoc(loc) { return decks(loc).flatMap((d) => d.items); }
  function deckActual() {
    if (S.votar.deck === "todos") return itemsLoc(S.votar.loc);
    const d = decks(S.votar.loc).find((x) => x.id === S.votar.deck);
    return d ? d.items : itemsLoc(S.votar.loc);
  }
  const puntoCiudad = (c) => `<span class="ciudad c-${esc(c)}" aria-hidden="true"></span>`;
  function pedidosParaMi() { return S.pedidos.filter((p) => p.by !== S.yo && !(p.resp || {})[S.yo] && P.porId[p.act]); }

  // ---------- Inicio ----------
  function vInicio() {
    const yo = S.yo, dc = Deco.PERSONAS[yo];
    const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
    const faltan = Math.max(0, Math.round((Date.parse(D.inicio + "T12:00:00") - hoy) / 864e5));
    const ds = decks();
    const sig = ds.find((d) => d.hechos < d.items.length);
    const total = ds.reduce((s, d) => s + d.items.length, 0), hechos = ds.reduce((s, d) => s + d.hechos, 0);
    let html = `<section class="hero" style="--acento:${Deco.ACENTO[yo]}">
        <div class="hero-txt"><span class="hero-k">Faltan ${faltan} días · 4 al 25 de marzo</span><h1>Hola, ${esc(NOMBRE[yo])}</h1><p class="hero-lema">${esc(dc.lema)}</p></div>
        <div class="hero-escena">${Deco.escena(yo)}</div>
        <div class="hero-skyline">${Deco.silueta("NY", "#070b2c")}</div>
      </section>`;
    // En la copia de claude.ai (o la de la compu): avisar que la web compartida es la pública.
    if (window.SITIO && !window.NUBE) html += `<div class="banner"><span><b>La web de la familia se mudó.</b> <span class="suave">Esta copia no se comparte: lo que votes acá no lo ven los demás.</span></span><a class="btn coral chico" href="${esc(window.SITIO)}" target="_blank" rel="noopener">Ir a la web</a></div>`;
    html += sig
      ? `<section class="panel cta"><span class="dec-k" style="color:var(--oro)">Para votar</span><h2>Seguí con ${esc(sig.corto)}</h2>
          <p class="suave">${esc(sig.n)} · ${ciudad(sig.c)}</p>
          <div class="progreso" aria-label="${sig.hechos} de ${sig.items.length}"><i style="width:${(sig.hechos / sig.items.length) * 100}%"></i></div>
          <div class="fila-btns"><button class="btn oro" data-act="votar-deck" data-deck="${sig.id}">${I.estrella}Votar las ${sig.items.length - sig.hechos} que faltan</button><span class="tenue" style="font-size:14px">${sig.hechos} de ${sig.items.length} en este barrio · ${hechos} de ${total} en total</span></div></section>`
      : `<section class="panel cta"><span class="dec-k" style="color:var(--ok)">Votación</span><h2>¡Votaste todo!</h2><p class="suave">Podés cambiar cualquier voto cuando quieras.</p><div class="fila-btns"><button class="btn oro" data-act="ir" data-tab="plan">${I.calendario}Ver el plan</button></div></section>`;
    const items = [];
    const cinco = actsEnRuta().filter((a) => S.votos[yo][a.id] === 5 && !P.info[a.id].plan && !S.pedidos.some((p) => p.act === a.id && p.by === yo)).length;
    if (cinco) items.push(`<article class="dec"><span class="dec-k">Tus imperdibles</span><h3>${cinco} que votaste con 5 no ${cinco === 1 ? "entró" : "entraron"} al plan</h3><p>Revisalos y reclamá los que no te querés perder.</p><div class="fila-btns"><button class="btn coral chico" data-act="mias-5">Ver cuáles</button></div></article>`);
    for (const e of P.empates) items.push(`<article class="dec"><span class="dec-k">Empate · ${Plan.fechaCorta(e.fecha)}, ${FR[e.f].toLowerCase()}</span><h3>${esc(e.entra.n)} o ${esc(e.fuera.n)}</h3><p>Las dos tienen ${num1(P.pts[e.entra.id].prom)} de promedio y no entran juntas.</p><div class="fila-btns"><button class="btn coral chico" data-act="empate" data-fecha="${e.fecha}" data-f="${e.f}" data-a="${esc(e.entra.id)}" data-b="${esc(e.fuera.id)}">Elegir una</button></div></article>`);
    for (const p of pedidosParaMi()) {
      const a = P.porId[p.act];
      items.push(`<article class="dec"><span class="dec-k">Sí o sí de ${esc(NOMBRE[p.by])}</span><h3>${esc(a.n)}</h3><p>${Plan.fechaMedia(p.fecha)}, ${FR[p.f].toLowerCase()}${p.msg ? ` · “${esc(p.msg)}”` : ""}</p><div class="fila-btns"><button class="btn oro chico" data-act="responder" data-id="${esc(p.id)}" data-r="si">Me sumo</button><button class="btn chico" data-act="responder" data-id="${esc(p.id)}" data-r="no">Sigo con el plan</button></div></article>`);
    }
    for (const dv of misDivisiones()) {
      items.push(`<article class="dec"><span class="dec-k">¿A dónde vas? · ${Plan.fechaCorta(dv.fecha)}, ${FR[dv.f].toLowerCase()}</span><h3>${esc(dv.act.n)} o lo del plan</h3><p>${esc(textoDivision(dv))}</p><div class="fila-btns"><button class="btn coral chico" data-act="ir-dia" data-fecha="${dv.fecha}" data-ancla="${idDiv(dv)}">Ver y elegir</button></div></article>`);
    }
    if (items.length) html += `<section class="sec"><h2>Para decidir <small>${items.length}</small></h2><div class="decidir">${items.slice(0, 4).join("")}</div>${items.length > 4 ? '<div><button class="btn" data-act="decidir-todo">Ver todo</button></div>' : ""}</section>`;
    html += `<section class="sec"><h2>El viaje</h2><div class="postales">${P.R.paradas.map((p) => {
      const enPlan = P.acts.filter((a) => a.c === p.id && P.info[a.id].plan && !a.fr.includes("C") && P.info[a.id].plan.fecha >= p.desde && P.info[a.id].plan.fecha <= p.hasta).length;
      const fechas = p.noches ? `${+p.desde.slice(8)} al ${+p.hasta.slice(8)} de marzo` : `${Plan.fechaCorta(p.desde)} · de pasada`;
      return `<button class="postal c-${p.id}" data-act="ir-dia" data-fecha="${p.desde}"><div><b>${esc(D.paradas[p.id].nombre)}</b><span>${fechas}</span><span>${enPlan} cosas en el plan</span></div><div class="sil">${Deco.silueta(p.id)}</div></button>`;
    }).join("")}</div></section>`;
    html += `<section class="sec"><h2>La familia</h2><div class="familia">${PERS.map((p) => {
      const n = actsEnRuta().filter((a) => S.votos[p.k][a.id]).length;
      const pct = Math.round((n / Math.max(1, actsEnRuta().length)) * 100);
      return `<div class="miembro"><span class="anillo" style="--p:${pct};--acento:${Deco.ACENTO[p.k]}">${av(p.k, 60)}<span class="sticker">${stickerSvg(p.k, 24)}</span></span><span>${esc(p.n)}<small>${pct}% votado</small></span></div>`;
    }).join("")}</div><p class="tenue" style="font-size:14px">Votaste ${hechos} de ${total}. El plan se arma con lo que haya: no hace falta votar todo para verlo.</p></section>`;
    const pres = presupuesto();
    html += `<section class="panel"><button class="linea-link" data-act="ir-sub" data-sub="presupuesto">Presupuesto estimado <span>${dinero(pres.total / 4)} por persona ›</span></button></section>`;
    return html;
  }

  // ---------- Votar ----------
  function btnVoto(a, v, chico) {
    const mio = S.votos[S.yo][a.id];
    return `<button data-act="votar" data-id="${esc(a.id)}" data-v="${v}" aria-pressed="${mio === v}" aria-label="${v}: ${VOTO_LARGO[v]}"><b>${v}</b>${chico ? "" : `<span>${VOTO[v]}</span>`}</button>`;
  }
  function vVotar() {
    if (S.votar.modo !== "resultados") S.votar.modo = "una";

    const mios = S.votos[S.yo];
    const ruta = actsEnRuta();
    const hechos = ruta.filter((a) => mios[a.id]).length;
    const locs = localidades();
    if (S.votar.loc !== "todas" && !locs.some((l) => l.k === S.votar.loc)) S.votar.loc = "todas";
    const loc = S.votar.loc;
    const enLa = itemsLoc(loc);
    const hechosLoc = enLa.filter((a) => mios[a.id]).length;
    const ds = decks(loc);
    let deckId = S.votar.deck;
    if (deckId !== "todos" && !ds.some((d) => d.id === deckId)) deckId = loc === "todas" && ds.length ? (ds.find((d) => d.hechos < d.items.length) || ds[0]).id : "todos";
    S.votar.deck = deckId;
    const deckObj = ds.find((d) => d.id === deckId);
    const nombreDeck = deckObj ? deckObj.corto : loc === "todas" ? "todo el viaje" : loc;
    const items = deckActual();
    const hechosDeck = items.filter((a) => mios[a.id]).length;
    const locObj = locs.find((l) => l.k === loc);
    let html = `<section class="titulo"><h1>Votar</h1><p>Los votos de los demás aparecen después de que votás.</p></section>
      <section class="panel contador" style="--acento:${Deco.ACENTO[S.yo]}">
        <div class="contador-n"><b>${hechos}</b><span>de ${ruta.length} votadas</span></div>
        <div class="progreso" aria-hidden="true"><i style="width:${(hechos / Math.max(1, ruta.length)) * 100}%"></i></div>
        <p class="suave">${ruta.length - hechos ? `Te faltan ${ruta.length - hechos}.` : "¡Votaste todo!"}${loc !== "todas" ? ` En ${esc(loc)} llevás <b>${hechosLoc} de ${enLa.length}</b>.` : ""}</p>
      </section>
      <div class="fila-btns" style="justify-content:space-between"><div class="segmento" role="group" aria-label="Forma de votar">${[["una", "De a una"], ["resultados", "Resultados"]].map(([k, t]) => `<button data-act="vmodo" data-v="${k}" aria-pressed="${m === k}">${t}</button>`).join("")}</div><button class="btn chico" data-act="ir-lista">${I.lista}Ver en lista</button></div>
      <div class="selectores">
        <button class="selector" data-act="hoja-loc" data-ambito="votar"><span class="selector-t">Localidad</span><span class="selector-v">${locObj ? puntoCiudad(locObj.c) : ""}${esc(loc === "todas" ? "Todas" : loc)}</span><span class="selector-c">${hechosLoc}/${enLa.length}</span>${I.abajo}</button>
        ${m !== "resultados" && ds.length ? `<button class="selector" data-act="hoja-deck"><span class="selector-t">Barrio</span><span class="selector-v">${deckObj ? puntoCiudad(deckObj.c) : ""}${esc(deckObj ? deckObj.corto : "Todos")}</span><span class="selector-c">${hechosDeck}/${items.length}</span>${I.abajo}</button>` : ""}
      </div>`;
    if (m === "resultados") return html + vResultados();
    if (!ds.length) return html + `<p class="vacio">No hay actividades en ${esc(loc)}.</p>`;
    if (m === "lista") return html + vLista(items);
    let a = S.votar.actual && items.find((x) => x.id === S.votar.actual);
    if (!a) a = items.find((x) => !mios[x.id]);
    if (!a) {
      const otro = ds.find((d) => d.hechos < d.items.length);

        <div class="op-van">${van.length ? van.map((k) => `<span class="quien ${dv.elige[k] ? "" : "sug"}">${av(k, 24)}${esc(NOMBRE[k])}</span>`).join("") : '<span class="tenue">Nadie por ahora</span>'}</div>
        <button class="btn ${es ? "oro" : ""}" data-act="ir-lado" data-clave="${dv.clave}" data-k="${S.yo}" data-lado="${lado}" aria-pressed="${es}">${es ? `${I.tilde}Vas acá` : "Voy acá"}</button></div>`;
    };
